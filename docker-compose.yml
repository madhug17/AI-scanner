version: '3.8'

services:
  # --- Backend API & Web Dashboard ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_scanner_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://scanner_user:scanner_pass@postgres:5432/scanner_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Asynchronous Scan Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_scanner_worker
    command: ["python", "-m", "scanner.workers.kafka_consumer"]
    environment:
      - DATABASE_URL=postgresql://scanner_user:scanner_pass@postgres:5432/scanner_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: ai_scanner_postgres
    environment:
      POSTGRES_USER: scanner_user
      POSTGRES_PASSWORD: scanner_pass
      POSTGRES_DB: scanner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner_user -d scanner_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis Cache & Rate Limiting ---
  redis:
    image: redis:7-alpine
    container_name: ai_scanner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Apache Kafka & Zookeeper ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ai_scanner_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ai_scanner_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- Observability: Prometheus ---
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ai_scanner_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # --- Observability: Grafana ---
  grafana:
    image: grafana/grafana:10.0.0
    container_name: ai_scanner_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

